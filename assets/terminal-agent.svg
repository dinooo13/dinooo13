<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent CLI-style terminal intro</title>
  <desc id="desc">Animated agent CLI-like session where the user asks who dinooo13 is and the agent answers.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .bg { fill: #0a0d12; }
      .panel { fill: #0f141b; stroke: #273244; }
      .line { stroke: #1f2937; }
      .muted { fill: #7d8590; }
      .text { fill: #c9d1d9; }
      .accent { fill: #2f81f7; }
      .ok { fill: #3fb950; }
      .warn { fill: #d29922; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .r1 { opacity: 0; animation: show .01s linear .4s forwards; }
      .r2 { opacity: 0; animation: show .01s linear 1.0s forwards; }
      .r3 { opacity: 0; animation: show .01s linear 1.6s forwards; }
      .r4 { opacity: 0; animation: show .01s linear 2.2s forwards; }
      .r5 { opacity: 0; animation: show .01s linear 2.8s forwards; }
      .r6 { opacity: 0; animation: show .01s linear 3.4s forwards; }
      .r7 { opacity: 0; animation: show .01s linear 4.0s forwards; }
      .r8 { opacity: 0; animation: show .01s linear 4.6s forwards; }
      @keyframes show { to { opacity: 1; } }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="960" height="380" rx="12" stroke-width="1.5"/>
  <line class="line" x1="20" y1="56" x2="980" y2="56" />

  <circle cx="40" cy="38" r="6" fill="#ff5f56" />
  <circle cx="60" cy="38" r="6" fill="#ffbd2e" />
  <circle cx="80" cy="38" r="6" fill="#27c93f" />

  <text x="104" y="43" class="mono muted" font-size="14">agent cli • /workspace/dinooo13 • main</text>

  <text x="42" y="88" class="mono accent" font-size="18">❯ agent -p "who is dinooo13?"</text>
  <text x="42" y="124" class="mono muted r1" font-size="16">thinking… gathering repo context</text>
  <text x="42" y="154" class="mono ok r2" font-size="16">✔ context loaded: README.md</text>
  <text x="42" y="184" class="mono text r3" font-size="16">&gt; name: Fabian Meyer</text>
  <text x="42" y="214" class="mono text r4" font-size="16">&gt; job: leader and software engineer</text>
  <text x="42" y="244" class="mono text r5" font-size="16">&gt; focus: Vue + Nuxt</text>
  <text x="42" y="274" class="mono text r6" font-size="16">&gt; workflow: agentic engineering.</text>

  <text x="42" y="320" class="mono muted" font-size="15">────────────────────────────────────────────────────────────</text>
  <text x="42" y="350" class="mono accent" font-size="18">❯ agent -p "what to build next?" <tspan class="cursor">▋</tspan></text>
</svg>
